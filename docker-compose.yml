services:
  hdhr-guide:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9003:9000" # Maps host port 9003 to container port 9000
    restart: unless-stopped
    environment:
      - HDHR_URL=${HDHR_URL}
      - PORT=${HDHR_GUIDE_PORT:-9000}
      - REFRESH_HOURS=${HDHR_GUIDE_REFRESH_HOURS:-12}
